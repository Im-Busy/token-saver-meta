[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextslim"
version = "0.1.0"
description = "Token-optimized CLI wrappers — Python rewrite of ContextSlimAI"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "psutil>=5.9",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/Im-Busy/token-saver-meta"

[project.optional-dependencies]
db = ["pymysql>=1.0", "psycopg2-binary>=2.9"]
tiktoken = ["tiktoken>=0.5"]

[project.scripts]
contextslim = "contextslim.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
