[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextslim"
version = "0.1.0"
description = "Token-optimized CLI wrappers — Python rewrite of ContextSlimAI"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
db = ["pymysql>=1.0", "psycopg2-binary>=2.9"]
tiktoken = ["tiktoken>=0.5"]

[project.scripts]
contextslim = "contextslim.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
