[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "token-saver-mem"
version = "0.1.0"
description = "Cross-session memory for token saving — Python rewrite of codex-agent-mem + Loom"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "click>=8.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/Im-Busy/token-saver-meta"

[project.scripts]
token-saver-mem = "token_saver_mem.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
