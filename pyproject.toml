[project]
name = "token-saver-meta"
version = "0.1.1"
description = "Token Saving for the Masses — zero-config token-saving toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "mcp>=1.0",
    "click>=8.0",
    "rich>=13.0",
    "psutil>=5.9",
]
keywords = ["token-saver", "token-optimization", "context-compression", "llm", "ai-agent", "cli"]
authors = [{ name = "Joey Chiu" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
token-saver-meta = "src.installer:main"
tscg = "tscg.__main__:main"
token-saver-mem = "token_saver_mem.__main__:main"
contextslim = "contextslim.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/Im-Busy/token-saver-meta"
Repository = "https://github.com/Im-Busy/token-saver-meta"
Issues = "https://github.com/Im-Busy/token-saver-meta/issues"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.hatch.build.targets.wheel.force-include]
"tscg-py/src/tscg" = "tscg"
"token-saver-mem/src/token_saver_mem" = "token_saver_mem"
"contextslim-py/src/contextslim" = "contextslim"
"platforms/matrix.json" = "platforms/matrix.json"

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "tiktoken>=0.7.0",
]
