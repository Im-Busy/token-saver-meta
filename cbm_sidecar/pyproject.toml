[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbm-sidecar"
version = "0.1.0"
description = "CBM sidecar MCP server — context, rename, route_map tools"
requires-python = ">=3.10"
dependencies = ["mcp>=1.0.0"]

[project.scripts]
cbm-sidecar = "cbm_sidecar.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
